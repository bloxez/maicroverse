#!maicro
#---
# title: mAIql Default Tasks Setup
# intent: Create the baseline mAIql AI tasks used by this workspace setup.
# description: Recreates the full default AI task set in a deterministic, repeatable order.
# tags:
#   - ai
#   - maiql
#   - setup
#---

###> RESET TARGET TASKS
mutation ResetDefaultAiTasks {
  removeDescribeImage: AiTaskDelete(key: "describe_image", failIfNotFound: false) {
    success
    message
  }
  removeEmbedText: AiTaskDelete(key: "embed_text", failIfNotFound: false) {
    success
    message
  }
  removeJsonExtraction: AiTaskDelete(key: "json_extraction", failIfNotFound: false) {
    success
    message
  }
  removeOcrMarkdown: AiTaskDelete(key: "ocr_markdown", failIfNotFound: false) {
    success
    message
  }
  removeTextJson: AiTaskDelete(key: "text_json", failIfNotFound: false) {
    success
    message
  }
  removeTranscribeAudio: AiTaskDelete(key: "transcribe_audio", failIfNotFound: false) {
    success
    message
  }
}

###> CREATE describe_image
mutation CreateDescribeImageTask {
  AiTaskAdd(
    key: "describe_image"
    task: {
      label: "Describe an Image"
      description: "Create a detailed visual summary from an image. Use for accessibility text, triage, and quick human review."
      model: "vision"
      sources: ["image"]
      output_mode: "json"
      prompt: "You are an expert visual analyst. Describe this image in rich detail as plain text. Cover scene layout, visible objects, people, actions, text in the image, colors, lighting, context clues, and notable ambiguities. Do not return JSON, markdown, or bullet points. Return a single detailed paragraph."
    }
  ) {
    success
    key
    message
  }
}

###> CREATE embed_text
mutation CreateEmbedTextTask {
  AiTaskAdd(
    key: "embed_text"
    task: {
      label: "Embed Text"
      description: "Convert text into vector embeddings. Use for semantic search, similarity matching, and retrieval pipelines."
      model: "embedding"
      sources: ["text"]
      output_mode: "vector"
      prompt: "This is a vector embedding task. Process the text and return a vector representation."
    }
  ) {
    success
    key
    message
  }
}

###> CREATE json_extraction
mutation CreateJsonExtractionTask {
  AiTaskAdd(
    key: "json_extraction"
    task: {
      label: "JSON data extraction"
      description: "Extract structured JSON directly from an image. Use when you want one-step image-to-schema extraction."
      model: "vision"
      sources: ["image"]
      output_mode: "json"
      prompt: "You are a precise data extraction engine.\nReturn ONLY one valid JSON object.\nDo not return markdown, code fences, or explanations.\nUse this output template exactly:\n{output_template}\nIf a value is missing for any key, use an appropriate alternative such as an empty string or 0.\nContent to extract from:\n{content}"
    }
  ) {
    success
    key
    message
  }
}

###> CREATE ocr_markdown
mutation CreateOcrMarkdownTask {
  AiTaskAdd(
    key: "ocr_markdown"
    task: {
      label: "Extract Markdown"
      description: "Convert image or PDF pages into clean Markdown text. Use as the OCR stage before text analysis or extraction."
      model: "ocr"
      sources: ["image", "pdf"]
      output_mode: "text"
      prompt: "You are extracting text from a document image and producing the final result as raw Markdown.\n\nCRITICAL OUTPUT RULES\n- Output only the final Markdown document.\n- Never use fenced code blocks.\n- Never output triple backticks.\n- Do not quote Markdown as an example; write the document itself.\n- Use only normal Markdown elements: headings, paragraphs, bullet lists, numbered lists, and tables.\n- Preserve document structure faithfully.\n- Tables and lists are critical and must be retained in their logical blocks.\n- Watch for multiline table cells: wrapped text inside one column is usually still one row, not multiple rows.\n\nContent to extract from:\n{content}"
    }
  ) {
    success
    key
    message
  }
}

###> CREATE text_json
mutation CreateTextJsonTask {
  AiTaskAdd(
    key: "text_json"
    task: {
      label: "Text to JSON"
      description: "Extract structured JSON from text or OCR output. Use after OCR when mapping content to a target schema."
      model: "completion"
      sources: ["text"]
      output_mode: "json"
      prompt: "You are a strict structured extraction engine.\nConvert the provided text into a single JSON object that matches the required schema.\nUse only information explicitly present in the text.\nIf a required value is missing, output null for that field.\nInput text:\n{content}"
    }
  ) {
    success
    key
    message
  }
}

###> CREATE transcribe_audio
mutation CreateTranscribeAudioTask {
  AiTaskAdd(
    key: "transcribe_audio"
    task: {
      label: "Transcribe Audio"
      description: "Transcribe spoken audio into plain text. Use before classification, summarization, or text-to-JSON extraction."
      model: "transcribe"
      sources: ["audio"]
      output_mode: "text"
      prompt: "You are a high-accuracy audio transcription engine. Transcribe all spoken words from the provided audio. Do not identify or label speakers. Do not infer names, roles, or speaker turns. Preserve punctuation and paragraph breaks where clear. If a word is unclear, use [inaudible]. Return plain text only."
    }
  ) {
    success
    key
    message
  }
}
