###> CREATE BOOK SERIES (GRAPH-ONLY)
#{
# ## Series Nodes
# Groups multi-volume books. The complete flag filters series by whether
# the narrative is finished.
#}
mutation CreateSeries {
  handmaids_series: GraphMutate(graph: "book_club_social", cypher:"MERGE (s:Series {name: 'The Handmaids Tale Series'}) SET s.source = 'graph-only', s.author = 'Margaret Atwood', s.complete = true RETURN count(s) as n") { rowCount }
  got_series: GraphMutate(graph: "book_club_social", cypher:"MERGE (s:Series {name: 'A Song of Ice and Fire'}) SET s.source = 'graph-only', s.author = 'George R.R. Martin', s.complete = false RETURN count(s) as n") { rowCount }
  foundation_series: GraphMutate(graph: "book_club_social", cypher:"MERGE (s:Series {name: 'Foundation Series'}) SET s.source = 'graph-only', s.author = 'Isaac Asimov', s.complete = true RETURN count(s) as n") { rowCount }
}

###> CONNECT BOOKS TO SERIES
#{
# ## PART_OF Relationships
# The position property enables ordered series traversals.
# total_books shows how far the series extends.
#}
mutation ConnectBookSeries {
  handmaids_s1: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: \"The Handmaid's Tale\"}), (s:Series {name: 'The Handmaids Tale Series'}) MERGE (b)-[:PART_OF {position: 1, total_books: 2}]->(s) RETURN count(*) as n") { rowCount }
  testaments_s2: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'The Testaments'}), (s:Series {name: 'The Handmaids Tale Series'}) MERGE (b)-[:PART_OF {position: 2, total_books: 2}]->(s) RETURN count(*) as n") { rowCount }
  got_s1: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'A Game of Thrones'}), (s:Series {name: 'A Song of Ice and Fire'}) MERGE (b)-[:PART_OF {position: 1, total_books: 7}]->(s) RETURN count(*) as n") { rowCount }
  foundation_s1: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Foundation'}), (s:Series {name: 'Foundation Series'}) MERGE (b)-[:PART_OF {position: 1, total_books: 7}]->(s) RETURN count(*) as n") { rowCount }
}

###> CONNECT READERS TO BOOKS
#{
# ## READ Relationships
# SQL-backed reader Person nodes connect to SQL-backed Book nodes.
# Both ends are SQL-backed, so every edge bridges relational and graph worlds.
# rating (1-5) and year make edges queryable for recommendation logic.
#}
mutation ConnectReadersToBooks {
  alice_handmaids: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Alice Johnson'}), (b:Book {name: \"The Handmaid's Tale\"}) MERGE (r)-[:READ {rating: 5, year: 2023}]->(b) RETURN count(*) as n") { rowCount }
  alice_beloved: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Alice Johnson'}), (b:Book {name: 'Beloved'}) MERGE (r)-[:READ {rating: 5, year: 2024}]->(b) RETURN count(*) as n") { rowCount }
  alice_kindred: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Alice Johnson'}), (b:Book {name: 'Kindred'}) MERGE (r)-[:READ {rating: 4, year: 2024}]->(b) RETURN count(*) as n") { rowCount }
  bob_got: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Bob Chen'}), (b:Book {name: 'A Game of Thrones'}) MERGE (r)-[:READ {rating: 5, year: 2022}]->(b) RETURN count(*) as n") { rowCount }
  bob_norwegian: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Bob Chen'}), (b:Book {name: 'Norwegian Wood'}) MERGE (r)-[:READ {rating: 4, year: 2023}]->(b) RETURN count(*) as n") { rowCount }
  carol_kindred: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Carol Williams'}), (b:Book {name: 'Kindred'}) MERGE (r)-[:READ {rating: 5, year: 2023}]->(b) RETURN count(*) as n") { rowCount }
  carol_orient: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'Carol Williams'}), (b:Book {name: 'Murder on the Orient Express'}) MERGE (r)-[:READ {rating: 4, year: 2022}]->(b) RETURN count(*) as n") { rowCount }
  david_foundation: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'David Kumar'}), (b:Book {name: 'Foundation'}) MERGE (r)-[:READ {rating: 5, year: 2023}]->(b) RETURN count(*) as n") { rowCount }
  david_got: GraphMutate(graph: "book_club_social", cypher:"MATCH (r:Person {table: 'readers', name: 'David Kumar'}), (b:Book {name: 'A Game of Thrones'}) MERGE (r)-[:READ {rating: 4, year: 2022}]->(b) RETURN count(*) as n") { rowCount }
