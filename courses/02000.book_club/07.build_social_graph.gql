#!maicro
#---
# title: Book Club Social Graph
# description: Build the full social graph — authors, readers, genres, series, and award networks all interconnected over SQL-backed nodes.
# difficulty: intermediate
# estimated_time: 15m
# tags:
#   - graph
#   - Graph
#   - relationships
#---

###> ENABLE Graph (IDEMPOTENT)
#{
# ## Enable Apache AGE
# Ensures Graph support is active before graph operations run.
#}
mutation EnableGraph {
  DbEnableGraph {
    age_extension
    status
  }
}

###> CREATE THE SOCIAL GRAPH (IDEMPOTENT)
#{
# ## Graph Container
# Creates book_club_social if it does not exist.
#}
mutation CreateGraph {
  Created: GraphCreate(name: "book_club_social", ifNotExists: true)
}

###> CONNECT AUTHORS TO THEIR BOOKS
#{
# ## WROTE Relationships
# Links SQL-backed author Person nodes to SQL-backed Book nodes.
# All 9 books covered, including both Atwood titles.
#}
mutation CreateWroteRelationships {
  atwood_handmaids: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Margaret Atwood'}), (b:Book {table: 'books', name: \"The Handmaid's Tale\"}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  atwood_testaments: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Margaret Atwood'}), (b:Book {table: 'books', name: 'The Testaments'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  martin_got: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'George R.R. Martin'}), (b:Book {table: 'books', name: 'A Game of Thrones'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  christie_orient: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Agatha Christie'}), (b:Book {table: 'books', name: 'Murder on the Orient Express'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  asimov_foundation: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Isaac Asimov'}), (b:Book {table: 'books', name: 'Foundation'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  morrison_beloved: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Toni Morrison'}), (b:Book {table: 'books', name: 'Beloved'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  gaiman_americangods: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Neil Gaiman'}), (b:Book {table: 'books', name: 'American Gods'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  butler_kindred: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Octavia Butler'}), (b:Book {table: 'books', name: 'Kindred'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
  murakami_norwegian: GraphMutate(graph: "book_club_social", cypher:"MATCH (a:Person {table: 'authors', name: 'Haruki Murakami'}), (b:Book {table: 'books', name: 'Norwegian Wood'}) MERGE (a)-[:WROTE]->(b) RETURN count(*) as n") { rowCount }
}

###> CREATE HISTORICAL INFLUENCE NODES (GRAPH-ONLY)
#{
# ## Graph-Only People
# Adds historical writers that exist only in graph space, not SQL tables.
#}
mutation CreateLiteraryInfluences {
  orwell: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Person {name: 'George Orwell'}) SET p.source = 'graph-only', p.known_for = 'dystopian satire' RETURN count(p) as n") { rowCount }
  tolkien: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Person {name: 'J.R.R. Tolkien'}) SET p.source = 'graph-only', p.known_for = 'epic mythology' RETURN count(p) as n") { rowCount }
  kafka: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Person {name: 'Franz Kafka'}) SET p.source = 'graph-only', p.known_for = 'surreal absurdism' RETURN count(p) as n") { rowCount }
  leguin: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Person {name: 'Ursula K. Le Guin'}) SET p.source = 'graph-only', p.known_for = 'speculative social fiction' RETURN count(p) as n") { rowCount }
}

###> CONNECT INFLUENCE EDGES
#{
# ## INFLUENCED_BY Relationships
# Crosses from SQL-backed authors to graph-only historical figures.
#}
mutation CreateInfluenceEdges {
  atwood_orwell: GraphMutate(graph: "book_club_social", cypher:"MATCH (auth:Person {table: 'authors', name: 'Margaret Atwood'}), (hist:Person {name: 'George Orwell'}) MERGE (auth)-[:INFLUENCED_BY {domain: 'dystopian fiction'}]->(hist) RETURN count(*) as n") { rowCount }
  martin_tolkien: GraphMutate(graph: "book_club_social", cypher:"MATCH (auth:Person {table: 'authors', name: 'George R.R. Martin'}), (hist:Person {name: 'J.R.R. Tolkien'}) MERGE (auth)-[:INFLUENCED_BY {domain: 'epic fantasy worldbuilding'}]->(hist) RETURN count(*) as n") { rowCount }
  murakami_kafka: GraphMutate(graph: "book_club_social", cypher:"MATCH (auth:Person {table: 'authors', name: 'Haruki Murakami'}), (hist:Person {name: 'Franz Kafka'}) MERGE (auth)-[:INFLUENCED_BY {domain: 'surreal absurdist fiction'}]->(hist) RETURN count(*) as n") { rowCount }
  butler_leguin: GraphMutate(graph: "book_club_social", cypher:"MATCH (auth:Person {table: 'authors', name: 'Octavia Butler'}), (hist:Person {name: 'Ursula K. Le Guin'}) MERGE (auth)-[:INFLUENCED_BY {domain: 'speculative social fiction'}]->(hist) RETURN count(*) as n") { rowCount }
}

###> CREATE PUBLISHERS (GRAPH-ONLY)
#{
# ## Publisher Nodes
# Expanded to cover all 9 books. Bantam Books publishes two titles,
# demonstrating the shared-publisher traversal pattern.
#}
mutation CreatePublishers {
  penguin: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'Penguin Books'}) SET p.source = 'graph-only', p.country = 'UK' RETURN count(p) as n") { rowCount }
  doubleday: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'Doubleday'}) SET p.source = 'graph-only', p.country = 'USA' RETURN count(p) as n") { rowCount }
  knopf: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'Knopf'}) SET p.source = 'graph-only', p.country = 'USA' RETURN count(p) as n") { rowCount }
  bantam: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'Bantam Books'}) SET p.source = 'graph-only', p.country = 'USA' RETURN count(p) as n") { rowCount }
  harpercollins: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'HarperCollins'}) SET p.source = 'graph-only', p.country = 'UK' RETURN count(p) as n") { rowCount }
  william_morrow: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'William Morrow'}) SET p.source = 'graph-only', p.country = 'USA' RETURN count(p) as n") { rowCount }
  vintage: GraphMutate(graph: "book_club_social", cypher:"MERGE (p:Publisher {name: 'Vintage International'}) SET p.source = 'graph-only', p.country = 'USA' RETURN count(p) as n") { rowCount }
}

###> CONNECT BOOKS TO PUBLISHERS
#{
# ## PUBLISHED_BY Relationships
# All 9 books connected. Year property enables timeline traversals.
#}
mutation ConnectPublishers {
  handmaids_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: \"The Handmaid's Tale\"}), (p:Publisher {name: 'Penguin Books'}) MERGE (b)-[:PUBLISHED_BY {year: 1985}]->(p) RETURN count(*) as n") { rowCount }
  testaments_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'The Testaments'}), (p:Publisher {name: 'Doubleday'}) MERGE (b)-[:PUBLISHED_BY {year: 2019}]->(p) RETURN count(*) as n") { rowCount }
  beloved_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Beloved'}), (p:Publisher {name: 'Knopf'}) MERGE (b)-[:PUBLISHED_BY {year: 1987}]->(p) RETURN count(*) as n") { rowCount }
  got_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'A Game of Thrones'}), (p:Publisher {name: 'Bantam Books'}) MERGE (b)-[:PUBLISHED_BY {year: 1996}]->(p) RETURN count(*) as n") { rowCount }
  orient_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Murder on the Orient Express'}), (p:Publisher {name: 'HarperCollins'}) MERGE (b)-[:PUBLISHED_BY {year: 1934}]->(p) RETURN count(*) as n") { rowCount }
  foundation_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Foundation'}), (p:Publisher {name: 'Bantam Books'}) MERGE (b)-[:PUBLISHED_BY {year: 1951}]->(p) RETURN count(*) as n") { rowCount }
  americangods_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'American Gods'}), (p:Publisher {name: 'William Morrow'}) MERGE (b)-[:PUBLISHED_BY {year: 2001}]->(p) RETURN count(*) as n") { rowCount }
  kindred_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Kindred'}), (p:Publisher {name: 'Doubleday'}) MERGE (b)-[:PUBLISHED_BY {year: 1979}]->(p) RETURN count(*) as n") { rowCount }
  norwegian_pub: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Norwegian Wood'}), (p:Publisher {name: 'Vintage International'}) MERGE (b)-[:PUBLISHED_BY {year: 1987}]->(p) RETURN count(*) as n") { rowCount }
}

###> CREATE LITERARY AWARDS (GRAPH-ONLY)
#{
# ## Award Nodes
# Expanded with World Fantasy Award and Nebula Award. American Gods won
# all three in 2002, making it the highest award-connected book in the graph.
#}
mutation CreateAwards {
  booker: GraphMutate(graph: "book_club_social", cypher:"MERGE (a:Award {name: 'Booker Prize'}) SET a.source = 'graph-only' RETURN count(a) as n") { rowCount }
  hugo: GraphMutate(graph: "book_club_social", cypher:"MERGE (a:Award {name: 'Hugo Award'}) SET a.source = 'graph-only' RETURN count(a) as n") { rowCount }
  pulitzer: GraphMutate(graph: "book_club_social", cypher:"MERGE (a:Award {name: 'Pulitzer Prize'}) SET a.source = 'graph-only' RETURN count(a) as n") { rowCount }
  world_fantasy: GraphMutate(graph: "book_club_social", cypher:"MERGE (a:Award {name: 'World Fantasy Award'}) SET a.source = 'graph-only' RETURN count(a) as n") { rowCount }
  nebula: GraphMutate(graph: "book_club_social", cypher:"MERGE (a:Award {name: 'Nebula Award'}) SET a.source = 'graph-only' RETURN count(a) as n") { rowCount }
}

###> CONNECT BOOKS TO AWARDS
#{
