#}
mutation ConnectAwards {
  testaments_booker: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'The Testaments'}), (a:Award {name: 'Booker Prize'}) MERGE (b)-[:WON {year: 2019}]->(a) RETURN count(*) as n") { rowCount }
  beloved_pulitzer: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Beloved'}), (a:Award {name: 'Pulitzer Prize'}) MERGE (b)-[:WON {year: 1988}]->(a) RETURN count(*) as n") { rowCount }
  foundation_hugo: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'Foundation'}), (a:Award {name: 'Hugo Award'}) MERGE (b)-[:WON {year: 1966}]->(a) RETURN count(*) as n") { rowCount }
  americangods_hugo: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'American Gods'}), (a:Award {name: 'Hugo Award'}) MERGE (b)-[:WON {year: 2002}]->(a) RETURN count(*) as n") { rowCount }
  americangods_nebula: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'American Gods'}), (a:Award {name: 'Nebula Award'}) MERGE (b)-[:WON {year: 2002}]->(a) RETURN count(*) as n") { rowCount }
  americangods_wf: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'American Gods'}), (a:Award {name: 'World Fantasy Award'}) MERGE (b)-[:WON {year: 2002}]->(a) RETURN count(*) as n") { rowCount }
  got_wf: GraphMutate(graph: "book_club_social", cypher:"MATCH (b:Book {name: 'A Game of Thrones'}), (a:Award {name: 'World Fantasy Award'}) MERGE (b)-[:WON {year: 1997}]->(a) RETURN count(*) as n") { rowCount }
}

###> CREATE GENRES (GRAPH-ONLY)
#{
# ## Genre Taxonomy
# Genre nodes form the thematic backbone of the graph. Multiple books share
# genres, creating fan-out patterns ideal for discovery traversals.
#}
mutation CreateGenres {
  dystopian: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Dystopian Fiction'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
  epic_fantasy: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Epic Fantasy'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
  mystery: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Golden Age Mystery'}) SET g.source = 'graph-only', g.era = 'classic' RETURN count(g) as n") { rowCount }
  scifi: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Science Fiction'}) SET g.source = 'graph-only', g.era = 'classic' RETURN count(g) as n") { rowCount }
  literary: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Literary Fiction'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
  speculative: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Speculative Fiction'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
  magical_realism: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Magical Realism'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
  japanese_lit: GraphMutate(graph: "book_club_social", cypher:"MERGE (g:Genre {name: 'Japanese Literary Fiction'}) SET g.source = 'graph-only', g.era = 'modern' RETURN count(g) as n") { rowCount }
}

