###> ENABLE FILE MANAGEMENT AND BACKGROUND JOBS
#{
# ## Platform Features
# mAIcro has optional features that must be explicitly enabled:
#
# - **File Storage** — Stores binary files (images, PDFs) directly in the database.
# - **Search** — Enables full-text search with automatic text chunking.
# - **Async Jobs** — Background task queue for long-running operations.
#
# Each feature creates its own system tables when enabled.
#}
#"
# First we turn on file storage, search, and background jobs.
# These platform features give later examples somewhere to store, find, and process work.
# "#
mutation EnableFeatures {
  FileStorageEnable {
    files_table
    chunks_table
  }

  SearchEnable {
    status 
    text_chunks_table
  }

  AsyncJobsEnable {
    jobs_table
    status
  }
}


###> CREATE TEAM ISOLATION FILTER TEMPLATE
#{
# ## Row-Level Security
# A **Filter Template** defines a reusable access policy.
# The `TeamIsolation` filter adds a `team_label` column to any table,
# then automatically restricts queries so users only see rows matching their team.
#
# Filter operators: `eq`, `neq`, `gt`, `lt`, `contains`, `startsWith`.
#
# ```mermaid
# flowchart LR
#     User -->|team_label = X| Filter
#     Filter -->|WHERE team_label = X| Database
# ```
#}
#"
# Here we create a reusable rule that keeps each team's notes private.
# The filter uses a row's team label to decide what the current user can see.
# "#
mutation CreateFilterTemplates {
  TeamFilter: FilterTemplateAdd(input: {
    name: "TeamIsolation"
    description: "Restricts access based on user's team - rows are only visible to members of the same team"
    column_definition: {
      name: "team_label"
      type: "String"
      enforced: "add"
      description: "Team identifier for row-level security"
    }
    computed_value: "team_label"
    operator: eq
  }) {
    id
    name
  }
}
