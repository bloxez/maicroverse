#!maicro
#---
# title: Verify Setup
# description: Confirm features, schema, graph state, vector embeddings, and semantic search behavior.
# difficulty: beginner
# estimated_time: 2m
# tags:
#   - verification
#   - vector-search
#   - introspection
#---

###> GET THE DATABASE STATE
#"
# We begin by checking the active project, enabled features, and available tables.
# This gives us a quick overview of the environment the course has prepared.
#"
#{
# ## Core State
# Reads project id, active schema context, enabled features, and table list.
#}
query DbState {
  ActiveInstance {
    label
  }

  SchemaDetails: JsonObject {
    DbSchemaName: eval(v: "{{@@.CTX.DbSchemaName}}")
    DbIdType: eval(v: "{{@@.CTX.DbIdType}}")
    DbIdField: eval(v: "{{@@.CTX.DbIdField}}")
    DbIdSuffix: eval(v: "{{@@.CTX.DbIdSuffix}}")
  }

  SystemFeatures {
    feature
  }

  DbTables {
    name
    description
  }

  PrjStores
}

###> GET DATABASE SCHEMA DETAILS
#"
# Now we inspect the database schema itself and how many tables it contains.
# This confirms we're looking at the expected project schema.
#"
#{
# ## Schema Info
# Returns schema owner, table count, and system-schema flags.
#}
query DatabaseSchema {
  DatabaseSchema: DbSchema {
    name
    owner
    tableCount
    isSystem
  }
}

###> GET SQL WRAP CONFIGURATIONS
#"
# This query checks whether any SQL wrappers are registered.
# They aren't central to the Book Club, but they're part of the wider platform picture.
#"
#{
# ## SQL Wraps
# Lists registered SQL wrappers and their contract details.
#}
query SqlWraps {
  SqlWrappers {
    name
    operation
    sql
    inputs
    outputs
    createdAt
    createdBy
  }
}

###> GET API WRAP CONFIGURATIONS
#"
# Here we inspect configured API wrappers and their request and response mappings.
# It's another small check of the platform's integration layer.
#"
#{
# ## API Wraps
# Lists registered API wrappers and their HTTP mapping metadata.
#}
query ApiWraps {
  ApiWrappers {
    name
    operation
    endpoint
    method
    inputs
    outputs
    responseMapping
    createdAt
    createdBy
  }
}

###> VERIFY VECTOR EMBEDDINGS ARE STORED
#"
# We look at a few book synopses alongside their generated vectors.
# Seeing those values confirms the embedding pipeline ran as the books were seeded.
#"
#{
# ## Vector Verification
# Confirms synopsis_vector values were generated during seed inserts.
#}
query VerifyVectorEmbeddings {
  VerifyBookVectors: books(page: { page: 1, items: 3 }) {
    id
    title
    synopsis
    synopsis_vector
  }
}

###> SEMANTIC VECTOR SEARCH - FIND BOOKS BY MEANING
#"
# Let's search for a concept and see which book summaries are closest in meaning.
# The matching words don't need to be identical for a book to be relevant.
#"
#{
# ## Semantic Search
# Compares query embedding to stored vectors to return conceptually similar books.
#}
query SemanticBookSearch {
  AndroidBooks: books(
    where: { synopsis_vector: { query: "android technologies" } }
    page: { page: 1, items: 5 }
  ) {
    id
    title
    genre
    synopsis
  }
}

###> SEMANTIC SEARCH WITH DISTANCE THRESHOLD
#"
# This final search adds a maximum distance to narrow the matches.
# Lower distances mean the returned book is closer to the idea we're searching for.
#"
#{
# ## Distance Filtering
# Adds a maximum vector distance; lower values are closer semantic matches.
#}
query FindSimilarBooksWithThreshold {
  TimeTravelBooks: books(
    where: { synopsis_vector: { query: "time travel and historical fiction", distance: 1.35 } }
    page: { page: 1, items: 3 }
  ) {
    id
    title
    synopsis
  }
}
