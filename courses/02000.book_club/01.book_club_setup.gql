#---
# title: Book Club Full Setup
# intent: Learn how mAIcro auto-generates a full GraphQL API, syncs SQL rows to a graph, and enables semantic search — all without writing backend code.
# description: End-to-end setup of the book club database. This script orchestrates all setup steps in order — run it once to get a fully working book club with SQL tables, graph integration, seed data, semantic search, and team demo users/notes.
# difficulty: beginner
# estimated_time: 17m
# video: https://www.youtube.com/watch?v=dhi7l1kZi9Y
# tags:
#   - database
#   - graphql
#   - vector-search
#   - graph
#   - seed
# resources:
