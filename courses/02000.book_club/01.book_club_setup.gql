#!maicro
#---
# title: Book Club Full Setup
# intent: Learn how mAIcro auto-generates a full GraphQL API, syncs SQL rows to a graph, and enables semantic search — all without writing backend code.
# description: End-to-end setup of the book club database. This script orchestrates all setup steps in order — run it once to get a fully working book club with SQL tables, graph integration, seed data, semantic search, and team demo users/notes.
# difficulty: beginner
# estimated_time: 17m
# video: https://www.youtube.com/watch?v=dhi7l1kZi9Y
# tags:
#   - database
#   - graphql
#   - vector-search
#   - graph
#   - seed
# resources:
#   - type: docs
#     url: /reference/database
#     title: Database Reference
#   - type: docs
#     url: /reference/filters
#     title: Filter Templates
#---

###> CLEAR
#{
# ## Reset
# Wipes the database clean: terminates async jobs, drops all tables, and removes any Apache AGE graphs.
# This makes the script safe to re-run at any time.
#}
mutation Clear {
  DbExecute(path: "./02.clear_db.gql") {
    success message result
  }
}

###> PLATFORM SETUP
#{
# ## Platform Features & Filters
# Enables File Storage, Full-Text Search, and Async Jobs — then creates the
# `TeamIsolation` filter template for row-level security.
#}
mutation PlatformSetup {
  DbExecute(path: "./03.platform_setup.gql") {
    success message result
  }
}


###> AI TASK SETUP
#{
# ## Useful AI Tasks
# These AI tasks are broadly useful for supporting things like vector embedding and extracting information from documents and images.
# We must run this for the Book Club, as we use vector embeddings to search for books where the synopsis matches user interests.
#}
mutation AiTaskSetup {
  DbExecute(path: "./03a.ai_task_setup.gql") {
    success message result
  }
}

###> CREATE TABLES
#{
# ## Database Schema
# Creates the `readers`, `authors`, `books`, `reviews`, and `team_notes` tables.
# mAIcro auto-generates a full GraphQL API for each table, then `DbReload`
# makes the new types immediately available.
#}
mutation CreateTables {
  DbExecute(path: "./04.create_tables.gql") {
    success message result
  }
}

###> GRAPH BOOTSTRAP
#{
# ## Install Graph Triggers
# Enables Apache AGE, creates the `book_club_social` graph, and installs
# AFTER INSERT/DELETE triggers on readers, authors, and books.
#
# **Order matters:** this must run before seeding data so every inserted row
# automatically creates a matching graph node.
#}
mutation GraphBootstrap {
  DbExecute(path: "./05.graph_bootstrap.gql") {
    success message result
  }
}

###> SEED DATA
#{
# ## Populate the Database
# Inserts 8 readers, 8 authors, 18 books, and 40 reviews.
# Because the graph triggers are already installed, each insert also creates
# a SQL-backed graph node automatically — no extra code required.
#}
mutation SeedData {
  DbExecute(path: "./06.seed_data.gql") {
    success message result
  }
}

###> BUILD SOCIAL GRAPH
#{
# ## Enrich the Graph
# Adds the graph-only layer on top of the SQL-backed nodes:
# - WROTE edges connecting authors to their books
# - 8 historical literary influences (graph-only Person nodes)
# - 5 publishers (graph-only) with PUBLISHED_BY edges to books
# - 6 literary awards (graph-only) with WON edges to books
# - Power traversal queries demonstrating SQL + Cypher integration
#}
mutation BuildSocialGraph {
  DbExecute(path: "./07.build_social_graph.gql") {
    success message result
  }
}

###> TEAM DEMO SETUP
#{
# ## Seed Team Demo Users and Notes
# Creates Team A / Team B users, assigns memberships and roles, then seeds
# team-scoped notes so row-level isolation is ready to test immediately in IDE.
#}
mutation TeamDemoSetup {
  DbExecute(path: "./20.teams_setup.gql") {
    success message result
  }
}

###> VERIFY
#{
# ## Confirm Everything Works
# Checks all platform features, tables, and graph nodes are in place.
# Tests vector embeddings and semantic search.
#}
mutation Verify {
  DbExecute(path: "./08.verify.gql") {
    success message result
  }
}
