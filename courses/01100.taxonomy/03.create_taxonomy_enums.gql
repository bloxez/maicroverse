###> CREATE TAXONOMY ENUMS (DOCUMENTED)
mutation CreateTaxonomyEnums {
  document_purpose: DbCreateEnum(
    name: "DocumentPurpose"
    description: "Classifies taxonomy documents by purpose."
    values: [
      "Identification::Identity and identification documents used to verify a person."
      "Clinical::Clinical and medical care records used for health context."
      "Plan::Care planning and support planning documents."
      "Financial::Financial assessment and authority-related documents."
      "Legal::Legal authority and guardianship documents."
    ]
  ) { enum values }

  document_type: DbCreateEnum(
    name: "DocumentType"
    description: "Lists the document IDs defined in taxonomy documents."
    values: [
      "DriversLicense::Australian state or territory driver licence."
      "Passport::National passport identity document."
      "MedicareCard::Australian Medicare entitlement card."
      "PensionCard::Australian pension or concession entitlement card."
      "DVACard::Department of Veterans' Affairs entitlement card."
      "GPHealthSummary::General practitioner health summary report."
      "CurrentMedicationList::Current prescribed medication list."
      "AlliedHealthReports::Reports from allied health practitioners."
      "HospitalDischargeSummary::Hospital discharge summary document."
      "AssessmentOutcomeLetter::Outcome letter from formal assessment."
      "AdvanceCareDirective::Advance care directive document."
      "BehaviourSupportPlan::Behaviour support planning document."
      "MyAgedCareSupportPlan::Support plan generated via My Aged Care."
      "SupportAtHomeCarePlan::Support at Home program care plan."
      "FinancialAuthorityDocuments::Documents granting financial authority."
      "ResidentialMeansAssessmentOutcome::Residential means assessment outcome notice."
      "SA457::Support at Home form SA457."
      "SA485::Support at Home form SA485."
      "EnduringPowerOfAttorney::Enduring power of attorney legal document."
      "GuardianshipOrders::Guardianship order issued by tribunal or court."
    ]
  ) { enum values }

  dva_card_colour: DbCreateEnum(
    name: "DVACardColour"
    description: "Allowed DVA card colour values extracted from DVACard.card_colour."
    values: [
      "Gold::Gold DVA card indicating broad treatment eligibility."
      "White::White DVA card indicating accepted-condition coverage."
      "Orange::Orange DVA card indicating pharmaceutical benefits."
    ]
  ) { enum values }
}