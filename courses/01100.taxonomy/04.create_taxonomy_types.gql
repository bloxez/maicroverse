###> RELOAD SCHEMA TO EXPOSE NEW ENUMS TO TYPE REGISTRATION
mutation ReloadSchemaForEnums {
  DbReload
}

###> CREATE TAXONOMY DOCUMENT TYPES (COMPACT)
mutation CreateTaxonomyDocumentTypes {
  passport: RegisterType(
    name: "Passport"
    description: "Structured extraction payload for Passport documents."
    fields: [
      { name: "document_date", type: "String", description: "Document date used for recency and source conflict resolution." }
      { name: "issuing_country", type: "String", description: "Extracted issuing country value." }
      { name: "type", type: "String", description: "Extracted type value." }
      { name: "code", type: "String", description: "Extracted code value." }
      { name: "given_names", type: "String", description: "Extracted given names value." }
      { name: "surname", type: "String", description: "Extracted surname value." }
      { name: "date_of_birth", type: "String", description: "Extracted date of birth value." }
      { name: "sex", type: "String", description: "Extracted sex value." }
      { name: "place_of_birth", type: "String", description: "Extracted place of birth value." }
      { name: "nationality", type: "String", description: "Extracted nationality value." }
      { name: "observations", type: "String", description: "Extracted observations value." }
      { name: "expiry", type: "String", description: "Extracted expiry value." }
      { name: "signature", type: "String", description: "Extracted signature value." }
    ]
  ) { success name message }

  drivers_license: RegisterType(
    name: "DriversLicense"
    description: "Structured extraction payload for DriversLicense documents."
    fields: [
      { name: "document_date", type: "String", description: "Document date used for recency and source conflict resolution." }
      { name: "number", type: "String", description: "Extracted number value." }
      { name: "class", type: "String", description: "Extracted class value." }
      { name: "first_name", type: "String", description: "Extracted first name value." }
      { name: "middle_name", type: "String", description: "Extracted middle name value." }
      { name: "last_name", type: "String", description: "Extracted last name value." }
      { name: "date_of_birth", type: "String", description: "Extracted date of birth value." }
      { name: "signature", type: "String", description: "Extracted signature value." }
      { name: "issuing_state", type: "String", description: "Extracted issuing state value." }
      { name: "street", type: "String", description: "Address street value." }
      { name: "suburb", type: "String", description: "Address suburb value." }
      { name: "state", type: "String", description: "Address state value." }
      { name: "postcode", type: "String", description: "Address postcode value." }
    ]
  ) { success name message }

  dva_card: RegisterType(
    name: "DVACard"
    description: "Structured extraction payload for DVACard documents."
    fields: [
      { name: "document_date", type: "String", description: "Document date used for recency and source conflict resolution." }
      { name: "card_colour", type: "DVACardColour", description: "DVA card colour classification from the card face." }
      { name: "file_number", type: "String", description: "Extracted file number value." }
      { name: "expiry_date", type: "String", description: "Extracted expiry date value." }
      { name: "first_name", type: "String", description: "Extracted first name value." }
      { name: "last_name", type: "String", description: "Extracted last name value." }
    ]
  ) { success name message }

