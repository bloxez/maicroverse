#!maicro
#---
# title: Taxonomy Setup
# description: Executes cleanup, enum creation, and type creation scripts in order.
# difficulty: beginner
# estimated_time: 2m
# tags:
#   - taxonomy
#   - orchestration
#   - enums
#   - types
#   - database
# intent: One-click execution of taxonomy bootstrap.
#---

###> STEP 1 — CLEAN UP EXISTING TAXONOMY OBJECTS
mutation Step1_CleanupTaxonomy {
  run_cleanup: DbExecute(path: "scripts/01100.taxonomy/02.cleanup_taxonomy.gql") {
    success
    message
    executionTime
    result
  }
}

###> STEP 2 — CREATE TAXONOMY ENUMS
mutation Step2_CreateTaxonomyEnums {
  run_enums: DbExecute(path: "scripts/01100.taxonomy/03.create_taxonomy_enums.gql") {
    success
    message
    executionTime
    result
  }
}

###> STEP 3 — CREATE TAXONOMY TYPES
mutation Step3_CreateTaxonomyTypes {
  run_types: DbExecute(path: "scripts/01100.taxonomy/04.create_taxonomy_types.gql") {
    success
    message
    executionTime
    result
  }
}