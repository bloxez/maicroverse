#!maicro
#---
# title: ASX Watcher - Full Course Setup Orchestrator
# description: Runs the full ASX watcher training course in teachable order.
# difficulty: beginner
# estimated_time: 4m
# tags:
#   - asx
#   - setup
#   - orchestrator
#   - training-course
# intent: Provide one command that executes the complete course bundle repeatably.
#---

###> STEP 1 - RUN RAW FETCH LESSON
#{
# Executes the first practical lesson that retrieves raw market JSON.
# stepinto: scripts/courses/10000.asx_watcher/02.multi_stock_raw.gql
#}
mutation Step1_RunRawFetch {
  step02: DbExecute(path: "scripts/courses/10000.asx_watcher/02.multi_stock_raw.gql") {
    success
    status
    message
    executionTime
  }
}

