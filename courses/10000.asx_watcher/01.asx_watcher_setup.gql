#!maicro
#---
# title: ASX Watcher - Full Course Setup Orchestrator
# description: Runs the full ASX watcher training course in teachable order.
# difficulty: beginner
# estimated_time: 4m
# tags:
#   - asx
#   - setup
#   - orchestrator
#   - training-course
# intent: Provide one command that executes the complete course bundle repeatably.
#---

###> RUN RAW FETCH LESSON
#{
# Executes the first practical lesson that retrieves raw market JSON.
#}
mutation RunRawFetch {
  step02: DbExecute(path: "scripts/courses/10000.asx_watcher/02.multi_stock_raw.gql") {
    success
    status
    message
    executionTime
  }
}

###> RUN SINGLE MARKDOWN LESSON
#{
# Converts one ticker payload into markdown so learners can inspect format quality.
#}
mutation RunSingleMarkdown {
  step03: DbExecute(path: "scripts/courses/10000.asx_watcher/03.single_stock_md.gql") {
    success
    status
    message
    executionTime
  }
}

###> RUN MULTI MARKDOWN LESSON
#{
# Expands markdown conversion to two tickers for side-by-side comparison.
#}
mutation RunMultiMarkdown {
  step04: DbExecute(path: "scripts/courses/10000.asx_watcher/04.multi_stock_md.gql") {
    success
    status
    message
    executionTime
  }
}

###> RUN BROWSER INTRO LESSON
