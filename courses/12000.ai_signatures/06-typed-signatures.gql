#
# Typed Signatures - Using RegisterType with AX-LLM
#
# This script demonstrates using RegisterType to create typed inputs/outputs
# for AI signatures instead of relying on JSON scalars.
#
# Key concepts:
# - RegisterType creates GraphQL types dynamically (no DbReload needed)
# - Types can be used with signatures, API wrappers, and SQL wrappers
# - IDE immediately sees new types in autocomplete
#

###> Step 1: Register an output type for ticket classification
# Create a typed output instead of using JSON with outputSchema.
# Type is immediately available - no DbReload required!
mutation CreateTicketClassificationType {
  RegisterType(
    name: "TicketClassification"
    description: "Classification result for customer support tickets"
    fields: [
      { name: "category", type: "String", description: "Primary category: billing, technical, account, general", required: true }
      { name: "urgency", type: "String", description: "Priority level: low, medium, high, critical", required: true }
      { name: "summary", type: "String", description: "One-sentence summary of the issue", required: true }
      { name: "confidence", type: "Float", description: "Confidence score 0.0 to 1.0" }
    ]
  ) {
    success
    name
    message
    graphql
  }
}

###> Step 2: Verify the type is in the schema
# Use introspection to confirm the type exists immediately.
query VerifyTypeExists {
  __type(name: "TicketClassification") {
    name
    kind
    fields {
      name
      type { name kind }
    }
  }
}

###> Step 3: Register an input type for ticket data
# Input types use kind: "input" and can be used as GraphQL input parameters.
mutation CreateTicketInputType {
  RegisterType(
    name: "TicketInput"
    description: "Input for ticket classification"
    kind: "input"
    fields: [
      { name: "ticketText", type: "String", description: "The customer's message", required: true }
      { name: "customerId", type: "String", description: "Customer identifier" }
      { name: "channel", type: "String", description: "Support channel: email, chat, phone" }
    ]
  ) {
    success
    name
    graphql
  }
}

###> Step 4: List all registered user types
# View all types that have been registered.
query ListAllUserTypes {
  ListUserTypes {
    name
    description
    kind
    fields {
      name
      type
      required
    }
  }
}

###> Step 5: Get GraphQL SDL for a specific type
# Useful for documentation or debugging.
query GetTypeGraphQL {
  GetUserTypeGraphQL(name: "TicketClassification")
}

###> Step 6: Register a complex nested type
# Types can include arrays and nested structures.
mutation CreateInvoiceDataType {
  RegisterType(
    name: "InvoiceData"
    description: "Structured invoice extraction result"
    fields: [
      { name: "vendorName", type: "String", description: "Company that issued the invoice", required: true }
      { name: "invoiceNumber", type: "String", description: "Unique invoice identifier" }
      { name: "invoiceDate", type: "String", description: "Date of invoice (ISO format)" }
      { name: "totalAmount", type: "Float", description: "Total amount due", required: true }
      { name: "currency", type: "String", description: "Currency code (USD, EUR, etc.)" }
      { name: "lineItems", type: "[JSON]", description: "Array of line item objects" }
    ]
  ) {
    success
    name
    graphql
  }
}

###> Step 7: Delete a type when no longer needed
# Clean up types that are no longer required.
