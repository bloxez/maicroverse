###> Summary: Type Usage Patterns
#
# 1. OUTPUT TYPES (kind: "type" - default)
#    - Return types for signatures, API wrappers, SQL wrappers
#    - Can have nullable fields (required: false)
#
# 2. INPUT TYPES (kind: "input")
#    - Input parameters for GraphQL mutations/queries
#    - Use with API wrappers that need typed inputs
#
# 3. BENEFITS OVER JSON:
#    - IDE autocomplete shows available fields
#    - Schema validation at query time
#    - Better documentation in GraphQL playground
#    - Type-safe client code generation
#
# 4. IMMEDIATE AVAILABILITY:
#    - No DbReload required
#    - IDE notified automatically via SSE
#    - Schema introspection updated instantly

