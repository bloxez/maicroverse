#
# Complex Data Extraction - Structured Output from Unstructured Text
#
# This script demonstrates extracting structured JSON from messy real-world documents.
# Key concepts:
# - Nested schemas with arrays and objects
# - Complex model hint for accuracy-critical tasks
# - Execution history for auditing and debugging
# Note: All returns are JSON type containing the full response object
#

###> Step 1: Create invoice extraction signature
# The output schema defines a complex nested structure with line items array.
# Using modelHint: "complex" routes to Claude for higher accuracy.
mutation CreateInvoiceExtraction {
  AxCreateSignature(
    id: "extractInvoice"
    name: "Extract Invoice Data"
    description: "Extract structured financial data from invoice text with line items"
    category: "extraction"
    inputSchema: {
      type: "object"
      properties: {
        invoice_text: { type: "string", description: "Raw invoice text or OCR output" }
      }
      required: ["invoice_text"]
    }
    outputSchema: {
      type: "object"
      properties: {
        vendor: { type: "string", description: "Company name" }
        vendor_address: { type: "string", description: "Full address" }
        invoice_number: { type: "string", description: "Invoice ID/number" }
        invoice_date: { type: "string", description: "Issue date (YYYY-MM-DD)" }
        due_date: { type: "string", description: "Payment due date (YYYY-MM-DD)" }
        subtotal: { type: "number", description: "Amount before tax" }
        tax: { type: "number", description: "Tax amount" }
        total: { type: "number", description: "Final total" }
        currency: { type: "string", description: "Currency code (USD, EUR, etc)" }
        line_items: {
          type: "array"
          description: "Individual line items on the invoice"
          items: {
            type: "object"
            properties: {
              description: { type: "string" }
              quantity: { type: "number" }
              unit_price: { type: "number" }
              total: { type: "number" }
            }
          }
        }
      }
      required: ["vendor", "invoice_number", "invoice_date", "total"]
    }
    modelHint: "complex"
  )
}

###> Step 2: Extract from a sample invoice
# Multi-line text is handled naturally. The LLM extracts structured data.
# Returns: { executionId, output: { vendor, total, line_items, ... }, metadata }
mutation ExtractSampleInvoice {
  ExecuteSignature(
    signatureId: "extractInvoice"
    input: {
      invoice_text: """
      ACME Corporation
      123 Business St, San Francisco, CA 94105
      
      INVOICE #INV-2026-001
      Date: January 10, 2026
      Due Date: February 10, 2026
      
      Professional Services:
      - Consulting (40 hrs @ $150/hr): $6,000.00
      - Development (20 hrs @ $200/hr): $4,000.00
      
      Subtotal: $10,000.00
      Tax (8.5%): $850.00
      TOTAL: $10,850.00 USD
      """
    }
  )
}

###> Step 3: Extract from a minimal invoice
# Test with sparse data - the model handles missing optional fields gracefully.
mutation ExtractMinimalInvoice {
  ExecuteSignature(
    signatureId: "extractInvoice"
    input: {
      invoice_text: "Invoice #12345 from Widget Co dated 2026-01-15 for $500.00"
    }
  )
}

###> Step 4: View execution history
# Returns: { executions: [{ id, timestamp, input, output, model, tokensUsed, durationMs, cost }] }
query ViewInvoiceExecutions {
  ListExecutions(signatureId: "extractInvoice", limit: 10)
}

###> Step 5: Get a specific execution by ID
# Use the executionId from a previous run to retrieve full details.
query GetExecutionDetails {
  GetExecution(id: "replace-with-actual-execution-id")
}
