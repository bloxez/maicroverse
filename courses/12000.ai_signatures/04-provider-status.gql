#
# Provider Status and Model Routing - Multi-Provider AI Operations
#
# mAIql supports multiple AI providers (OpenRouter, Ollama, Anthropic, OpenAI).
# Key concepts:
# - Check provider availability before creating signatures
# - Use modelHint to route to appropriate models
# - Cost varies significantly: local Ollama (free) vs cloud APIs (paid)
# - Model hints: simple, complex, reasoning, vision, embedding
#

###> Step 1: Check which providers are available
# Returns status and model count for each configured provider.
# OpenRouter provides access to 100+ models with single API key.
# Returns JSON - example: {"providers":[{"name":"openrouter","available":true,"modelsAvailable":150},...]}
query CheckProviderStatus {
  GetProviderStatus
}

###> Step 2: Create signature with "reasoning" model hint
# Reasoning models (o1-preview) excel at multi-step logical problems.
# These are more expensive but significantly better for complex reasoning.
# Returns JSON with signature details.
mutation CreateReasoningSignature {
  AxCreateSignature(
    id: "reasoningTask"
    name: "Multi-Step Reasoning"
    description: "Solve problems requiring logical reasoning and step-by-step analysis"
    category: "reasoning"
    inputSchema: {
      type: "object"
      properties: {
        problem: { type: "string", description: "The problem to solve" }
      }
      required: ["problem"]
    }
    outputSchema: {
      type: "object"
      properties: {
        steps: { 
          type: "array"
          items: { type: "string" }
          description: "Step-by-step reasoning"
        }
        conclusion: { type: "string", description: "Final answer" }
      }
      required: ["steps", "conclusion"]
    }
    modelHint: "reasoning"
  )
}

###> Step 3: Execute a reasoning task
# Watch the output to see provider/model selection and execution metadata.
# Returns JSON with executionId, output, and metadata (provider, model, cost, tokens).
mutation ExecuteReasoningTask {
  ExecuteSignature(
    signatureId: "reasoningTask"
    input: {
      problem: "A farmer has 17 sheep. All but 9 run away. How many sheep does the farmer have left?"
    }
  )
}

###> Step 4: Create a "simple" signature for fast/cheap operations
# Simple model hint routes to Ollama (local, free) for basic tasks.
# Returns JSON with signature details.
mutation CreateSimpleSignature {
  AxCreateSignature(
    id: "sentimentSimple"
    name: "Quick Sentiment Check"
    description: "Fast sentiment analysis for text - positive, negative, or neutral"
    category: "classification"
    inputSchema: {
      type: "object"
      properties: {
        text: { type: "string" }
      }
      required: ["text"]
    }
    outputSchema: {
      type: "object"
      properties: {
        sentiment: { type: "string", enum: ["positive", "negative", "neutral"] }
        confidence: { type: "number" }
      }
      required: ["sentiment"]
    }
    modelHint: "simple"
  )
}

###> Step 5: Execute simple task (fast, local, free)
# Returns JSON with execution result and metadata showing Ollama provider.
mutation ExecuteSimpleTask {
  ExecuteSignature(
    signatureId: "sentimentSimple"
    input: {
      text: "I absolutely love this product! Best purchase I've ever made."
    }
  )
}

###> Step 6: Model hint cost comparison
# Reference costs per 1M tokens (approximate):
#
# | Hint      | Provider    | Model                      | Cost/1M tokens |
# |-----------|-------------|----------------------------|----------------|
# | simple    | ollama      | llama3.1:8b                | FREE (local)   |
# | complex   | openrouter  | anthropic/claude-3.5-sonnet| ~$3            |
# | reasoning | openrouter  | openai/o1-preview          | ~$30           |
#
# Choose the right hint for your task:
# - simple: Classification, basic extraction, quick responses
# - complex: Detailed analysis, nuanced understanding, accuracy-critical
# - reasoning: Math, logic, multi-step problem solving
