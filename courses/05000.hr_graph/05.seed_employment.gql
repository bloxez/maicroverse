#!maicro
#---
# title: HR Graph — Seed Employment History
# description: |
#   Builds a realistic multi-year employment history using the registered wrappers.
#   Employment rules enforced by the wrappers:
#   - AddFullTimeEmployer: closes ALL open roles before opening the new full-time role
#   - AddPartTimeEmployer: silently skipped if an active full-time role exists
#   Employee profiles:
#   - Alice, Bob, David, Femi: full-time only career tracks
#   - Carmen, Emma: freelancers with multiple concurrent part-time roles
# tags: [graph, cypher, hr, seed]
#---

###> Alice - Axiom Labs (past full-time)
#{
# ## Alice Chen at Axiom Labs
# First full-time role. Closed automatically when Alice joins BluePeak Tech.
#}
mutation { AddFullTimeEmployer(employee: "Alice Chen", employer: "Axiom Labs", role: "Software Engineer", valid_from: "2020-03-01", valid_to: "2023-06-30") { data } }

###> Alice - BluePeak Tech (current full-time, closes Axiom)
#{
# ## Alice Chen at BluePeak Tech
# Current full-time role. `AddFullTimeEmployer` closed the Axiom role with `valid_to = 2023-07-01`
# before creating this edge, ensuring Alice has exactly one active role.
#}
mutation { AddFullTimeEmployer(employee: "Alice Chen", employer: "BluePeak Tech", role: "Senior Engineer", valid_from: "2023-07-01") { data } }

###> Bob - Cornerstone (past full-time)
#{
# ## Bob Okafor at Cornerstone
# First full-time role. Closed automatically when Bob joins DeltaCore.
#}
mutation { AddFullTimeEmployer(employee: "Bob Okafor", employer: "Cornerstone", role: "Product Manager", valid_from: "2019-05-01", valid_to: "2022-04-30") { data } }

###> Bob - DeltaCore (current full-time, closes Cornerstone)
#{
# ## Bob Okafor at DeltaCore
# Current full-time role. Cornerstone edge was closed before this one was created.
#}
mutation { AddFullTimeEmployer(employee: "Bob Okafor", employer: "DeltaCore", role: "Head of Product", valid_from: "2022-05-01") { data } }

