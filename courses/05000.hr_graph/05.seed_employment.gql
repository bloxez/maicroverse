###> Carmen - Axiom Labs (past part-time)
#{
# ## Carmen Silva at Axiom Labs (part-time)
# First consulting engagement. Carmen has no full-time role so `AddPartTimeEmployer`
# proceeds normally. This role has since closed.
#}
mutation { AddPartTimeEmployer(employee: "Carmen Silva", employer: "Axiom Labs", role: "ML Consultant", valid_from: "2021-06-01", valid_to: "2023-05-31") { data } }

###> Carmen - Ember Systems (active part-time)
#{
# ## Carmen Silva at Ember Systems (part-time, active)
# Ongoing advisory engagement. No full-time blocker — wrapper creates the edge.
#}
mutation { AddPartTimeEmployer(employee: "Carmen Silva", employer: "Ember Systems", role: "Data Science Advisor", valid_from: "2022-09-01") { data } }

###> Carmen - BluePeak Tech (active part-time, concurrent with Ember)
#{
# ## Carmen Silva at BluePeak Tech (part-time, active)
# Second concurrent active engagement. Demonstrates that multiple part-time roles
# are allowed simultaneously when there is no active full-time role.
#}
mutation { AddPartTimeEmployer(employee: "Carmen Silva", employer: "BluePeak Tech", role: "Research Advisor", valid_from: "2024-01-01") { data } }

