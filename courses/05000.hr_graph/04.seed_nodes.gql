#!maicro
#---
# title: HR Graph — Seed People & Companies
# description: Creates 6 Person nodes and 5 Company nodes as pure graph entities using MERGE.
#   MERGE is idempotent — running this script more than once will not create duplicates.
# tags: [graph, cypher, hr, seed]
#---

###> Alice Chen
#{
# ## Alice Chen (Person)
# Senior Engineer — full-time track (Axiom Labs → BluePeak Tech).
#}
mutation { GraphMutate(graph: "hr_graph", cypher: "MERGE (p:Person {name: 'Alice Chen'}) RETURN p.name AS result") { rowCount } }

