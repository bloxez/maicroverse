### > PromoPreview
# {
# ## Promo Query With Typed Virtual Calculations
#
# `price` is read directly from the DB.
# `discount_percent` is formatted text.
# `discounted_price` is computed with `CALC`, so it stays numeric.
#
# Expected example for product id 5 after the fixed source import:
#   name: Monitor 27" 4K
#   price: 599.99
#   discount_percent: 10%
#   discounted_price: 539.991
# }
query PromoPreview {
  products(
    page: { page: 1, items: 10 }
    sort: [{ key: "id", asc: true }]
  ) {
    id
    name
    price

    discount_percent: _v(chain: [
      { do: T, args: { template: "10%" } }
    ])

    discounted_price: _v(chain: [
      { do: CALC, args: { expression: "@.price * 0.9" } }
    ])
  }
}