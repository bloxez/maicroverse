#!maicro
#---
# title: CRON Weather Demo Setup
# description: Idempotent setup for a cron-driven weather ingestion demo. Creates API wrapper, resets table, and registers the scheduled job.
# difficulty: intermediate
# estimated_time: 10m
# tags:
#   - cron
#   - scheduling
#   - api-wrapper
#   - database
# intent: Learn how to orchestrate recurring data ingestion with mAIcro CRON jobs and script-based workers.
#---

###> STEP 1 - RESET EXISTING CRON STATE
#{
# ## Clean Slate
# Deletes all existing cron jobs so the course always starts from a known state.
#
# This makes the setup re-runnable for repeated practice sessions.
#}
mutation Step1_ResetCron {
  deletedCronJobs: CronJobDeleteAll
}

###> STEP 2 - RESET EXISTING API WRAPPER
#{
# ## Wrapper Reset
# Deletes the `GetWeather` wrapper if it exists.
#
# `ApiWrapDelete` is safe for reruns and avoids duplicate wrapper failures.
#}
mutation Step2_ResetWrapper {
  ApiWrapDelete(name: "GetWeather")
}

###> STEP 3 - CREATE WEATHER API WRAPPER
#{
# ## API Wrapper Registration
# Registers `GetWeather` as a GraphQL query resolver backed by Open-Meteo.
#
# We request current temperature via query params:
# - latitude
# - longitude
# - current
#}
mutation Step3_CreateWeatherWrapper {
  ApiWrap(
    name: "GetWeather"
    operation: "QUERY"
    endpoint: "https://api.open-meteo.com/v1/forecast"
    method: "GET"
    inputs: [
      { name: "latitude", type: "Float!", description: "Location latitude" }
      { name: "longitude", type: "Float!", description: "Location longitude" }
      { name: "current", type: "String", description: "Comma-separated weather fields" }
    ]
    outputs: [
      { name: "latitude", type: "Float", description: "Location latitude" }
      { name: "longitude", type: "Float", description: "Location longitude" }
      { name: "current", type: "JSON", description: "Current weather payload" }
    ]
  ) {
    success
    name
    message
  }
}

###> STEP 4 - RESET WEATHER TABLE
#{
# ## Table Reset
# Drops `weather_readings` before recreation, so schema changes and repeated runs
# remain deterministic.
#}
mutation Step4_DropWeatherTable {
  DbDropTable(name: "weather_readings")
}

###> STEP 5 - CREATE WEATHER TABLE
#{
# ## Destination Table
# Creates `weather_readings` used by the cron worker script.
#
# Each cron execution inserts one row per city.
#}
mutation Step5_CreateWeatherTable {
  DbCreateTable(
    name: "weather_readings"
    description: "Stores periodic weather readings from scheduled jobs"
    fields: [
      { name: "location", type: String, is_required: true, description: "City name" }
      { name: "temperature", type: Float, is_required: true, description: "Temperature in Celsius" }
      { name: "timestamp", type: Timestamp, is_required: true, description: "Source timestamp" }
    ]
  )
}

###> STEP 6 - RELOAD SCHEMA
#{
# ## Activate New Types
# Reloads GraphQL schema so newly created table mutations/queries become available.
#}
mutation Step6_ReloadSchema {
  DbReload
}

###> STEP 7 - REGISTER CRON JOB
#{
# ## Scheduled Worker
# Registers `australian-weather-collector` to execute every minute.
#
# The worker script path is stored in `context.scriptPath` and executed by cron.
#}
mutation Step7_CreateCronJob {
  CronJobCreate(input: {
    name: "australian-weather-collector"
    description: "Fetches weather for Perth, Adelaide, and Sydney every minute"
    schedule: "* * * * *"
    status: "active"
    context: {
      scriptPath: "scripts/courses/07000.cron/CRON_FETCH_WEATHER.gql"
    }
  }) {
    id
    name
    schedule
    status
    next_run_at
  }
}

###> STEP 8 - VERIFY SETUP
#{
# ## Quick Validation
# Confirms the cron job is active and that the destination table is reachable.
#}
query Step8_Verify {
  CronJobs(limit: 10) {
    id
    name
    schedule
    status
    run_count
    next_run_at
    last_error
  }

  weather_readings(page: { page: 1, items: 5 }) {
    id
    location
    temperature
    timestamp
  }
}
