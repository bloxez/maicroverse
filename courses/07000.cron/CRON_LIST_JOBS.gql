###> STEP 1 - LIST CRON JOBS
#{
# Lists recent cron jobs with status, next run, and error details.
#}
query Step1_ListCronJobs {
  CronJobs(limit: 50) {
    id
    name
    description
    schedule
    status
    run_count
    last_run_at
    next_run_at
    last_error
    created_at
    updated_at
  }
}
