#!maicro
#---
# title: CRON Worker - Fetch Weather
# description: Worker script executed by cron. Fetches weather data for three cities and persists rows to weather_readings.
# difficulty: beginner
# estimated_time: 3m
# tags:
#   - cron-worker
#   - api-wrapper
#   - ingest
#---

###> STEP 1 - FETCH PERTH WEATHER
#{
# Calls `GetWeather` for Perth and stores the response in script memory.
#}
query Step1_FetchPerth {
  perth: GetWeather(latitude: -31.9505, longitude: 115.8605, current: "temperature_2m") {
    current
  }
}

###> STEP 2 - SAVE PERTH READING
#{
# Inserts Perth reading into `weather_readings`.
#}
mutation Step2_SavePerth {
  weather_readingAdd(
    data: {
      location: "Perth"
      temperature: {{@@.perth.0.current.temperature_2m}}
      timestamp: {{timestamp_ms}}
    }
  ) {
    data { id }
  }
}

