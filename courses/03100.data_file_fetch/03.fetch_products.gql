###> READ PRODUCTS
#{
# ## Read Complete Products Dataset
# FileDataset uses the CSV header row as object keys and returns every subsequent
# row. The query fails if a row does not match the header column count.
#}
query FetchProducts {
  FileDataset(path: "maicroverse/customer_orders/products.csv")
}
