###> READ ORDERS
#{
# ## Read Complete Orders Dataset
# FileDataset parses each JSONL line as one object. The query succeeds only when
# the complete file can be read and every non-empty line is a JSON object.
#}
query FetchOrders {
  FileDataset(path: "maicroverse/customer_orders/orders.jsonl")
}
