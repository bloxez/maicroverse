###> STEP 1 - CLEAR CLIENT DATA
#{
# ## Reset Data
# Clears any prior client rows and resets the linked drivers license file so the demo can be rerun cleanly.
#
# stepinto: 02.clear_client_data.gql
#}
mutation Step1_ClearClientData {
  DbExecute(path: "scripts/courses/04000.clients/02.clear_client_data.gql") {
    success
    message
    result
  }
}

###> STEP 2 - CREATE CLIENTS TABLE
#{
# ## Create Schema
# Creates the `clients` table and reloads GraphQL schema so generated CRUD APIs are immediately available.
#
# stepinto: 03.create_clients_table.gql
#}
mutation Step2_CreateClientsTable {
  DbExecute(path: "scripts/courses/04000.clients/03.create_clients_table.gql") {
    success
    message
    result
  }
}

###> STEP 3 - SEED CLIENT RECORDS
#{
# ## Seed Data
# Inserts realistic demo clients that can be referenced by forms and documents later.
#
# stepinto: 04.seed_clients.gql
#}
mutation Step3_SeedClients {
  DbExecute(path: "scripts/courses/04000.clients/04.seed_clients.gql") {
    success
    message
    result
  }
}

###> STEP 4 - VERIFY CLIENT SETUP
#{
# ## Validate Setup
# Confirms `clients` exists and returns a sample of seeded rows.
#
# stepinto: 05.verify_clients.gql
#}
mutation Step4_Verify {
  DbExecute(path: "scripts/courses/04000.clients/05.verify_clients.gql") {
    success
    message
    result
  }
}

###> STEP 5 - RUN DRIVERS LICENSE DOCUMENT DEMO
#{
# ## Document Relationship Demo
# Configures the DriversLicense type, links document 82 to the first client, rebuilds AI output, and verifies typed traversal.
#
# stepinto: 09.clients_documents_demo.gql
#}
mutation Step5_RunDriversLicenseDemo {
  DbExecute(path: "scripts/courses/04000.clients/06.clients_documents_demo.gql") {
    success
    message
    result
  }
}

