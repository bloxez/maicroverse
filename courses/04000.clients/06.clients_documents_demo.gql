#!maicro
#---
# title: Clients Documents Typed Demo Setup
# description: Full clients-document relationship setup and verification using typed GraphQL traversal.
# difficulty: intermediate
# estimated_time: 3m
# tags:
#   - clients
#   - documents
#   - demo
#---

###> SET FILE STORAGE ROOT PATH
mutation SetRootPath {
  SetRoot: Remember(
    id: "import_root"
    path: "path"
    value: "maicroverse"
  )
}

###> RETRIEVE VALUE
#{
# ## Read Back Stored Value
# Retrieves the memory value just written so the script can verify
# the path is available in execution context.
#}
query GetRootPath {
  import_root: Recall(
    id: "import_root"
    path: "path"
  )
}

###> FETCH DRIVERS LICENSE IMAGE
mutation PullDriversLicense {
  FolderFetchFromUrl(
    url: "https://github.com/bloxez/maicroverse/tree/main/file_storage/au_identity"
    path: "{{import_root}}/au_identity"
    overwrite: true
  ) { path file_size content_type }
}

###> CONFIGURE TYPE + RELATIONSHIP
mutation ConfigureRelationship {
  DbExecute(path: "scripts/courses/04000.clients/07.configure_drivers_license_relationship.gql") {
    success
    message
    result
  }
}

###> LINK DOCUMENT TO CLIENT VIA metadata.custom_fields.client_id
mutation LinkDocument {
  DbExecute(path: "scripts/courses/04000.clients/08.link_document_to_client.gql") {
    success
    message
    result
  }
}

###> ANALYZE DOCUMENT TO REBUILD ai_results
mutation AnalyzeDocument {
  FileAnalyze(
    id: "{{DbExecute.result.target_file.metadata.id}}"
    options: {
      tasks: ["drivers_license"]
      timeout: 60
    }
  ) {
    id
    job_id
  }
}

###> WAIT FOR ANALYSIS TO COMPLETE
mutation WaitForAnalysis {
  AwaitJobCompletion(jobId: "{{FileAnalyze.job_id}}") {
    id
    status
    error
    result
  }
}

###> VERIFY TYPED TRAVERSAL + DATA ASSERTIONS
mutation VerifyTypedTraversal {
  DbExecute(path: "scripts/courses/04000.clients/09.verify_client_drivers_license_typed.gql") {
    success
    message
    result
  }
}
