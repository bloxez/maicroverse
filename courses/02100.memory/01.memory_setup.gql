###> RESET MEMORY
#{
# ## Start Clean
# Removes all memory blocks to make this course safely repeatable.
# stepinto: scripts/courses/02100.memory/02.reset_memory.gql
#}
mutation ResetMemory {
  DbExecute(path: "scripts/courses/02100.memory/02.reset_memory.gql") {
    success
    message
    result
  }
}

###> CREATE BLOCKS
#{
# ## Seed Initial Context
