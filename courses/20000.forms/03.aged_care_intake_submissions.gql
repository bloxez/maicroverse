###> script_overview
# Purpose: Reset demo submission rows, then seed deterministic aged care submissions.
# Safety: Existing rows for aged_care_intake_v1 are deleted before inserts to avoid duplicates.
# Contract: Save uses required submission_id and responses[].

###> delete_previous_aged_care_responses
mutation DeleteResponses{
  deleteExistingResponses: formSubmissionDeleteWhere(where: { form_definition_id: { eq: "aged_care_intake_v1" } }) {
    count
  }
}

