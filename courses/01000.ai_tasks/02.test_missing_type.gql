#!maicro
#---
# title: Test Missing Type
# description: Show the failure returned when an AI task references a type before it exists.
# difficulty: beginner
# estimated_time: 2m
# tags:
#   - ai
#   - validation
#---
###> NEGATIVE CASE - TASK BEFORE TYPE EXISTS
mutation RejectMissingDriversLicenseType {
  AiTaskAdd(
    key: "test_drivers_license"
    task: {
      label: "Drivers License"
      description: "Extract structured data from a driver's license"
      model: "vision"
      sources: ["image"]
      prompt: """
You are a precise data extraction engine.
Return ONLY one valid JSON object.
Do not return markdown, code fences, or explanations.
Use this output template exactly:
{output_template}
If a value is missing, use an empty string.

Content to extract from:
{content}
"""
      output_mode: "graphql_type"
      graphql_type: "DriversLicense"
    }
  ) {
    success
    key
    message
  }
}