#!maicro
#---
# title: Add Drivers License Task
# description: Create the AI task that extracts structured drivers license data.
# difficulty: beginner
# estimated_time: 2m
# tags:
#   - ai
#   - tasks
#---
###> DELETE AI TASK
mutation DeleteAitask {
  AiTaskDelete(key: "drivers_license", failIfNotFound: false) {
    success
  }
}

###> CREATE AI TASK
mutation AddDriversLicenseTask {
  AiTaskAdd(
    key: "drivers_license"
    task: {
      label: "Drivers License"
      description: "Extract structured data from a driver's license"
      model: "vision"
      sources: ["image"]
      prompt: """
You are a precise data extraction engine.
Return ONLY one valid JSON object.
Do not return markdown, code fences, or explanations.
Use this output template exactly:
{output_template}
If a value is missing, use an empty string.

Content to extract from:
{content}
"""
      output_mode: "json"
      graphql_type: "DriversLicense"
      process: [{
        do: "AI_ANALYZE_FILE"
        args: {
          fileId: "@@.file.id"
          task: "@@.task.key"
          taskInputs: "@@.task.inputs"
          timeout: "@@.options.timeout"
        }
      }]
      chunk_task_output: true
      embed_task_output: false
      smart_chunk_task_output: false
    }
  ) {
    success
    key
    message
    task {
      key
      label
      description
      model
      sources
      prompt
      output_mode
      graphql_type
      missing_value
    }
  }
}