###> STEP 1 - OPEN SESSION
#{
# Opens a browser session with autoClose disabled for explicit closure.
#}
mutation Step1_OpenListClose {
  demo: X4m(
    pipeline: "BROWSER_OPEN(headless:true, executablePath:'/usr/bin/google-chrome', autoClose:false) | BROWSER_LIST | BROWSER_CLOSE"
    runtime: { input: "" }
  ) {
    result
  }
}
