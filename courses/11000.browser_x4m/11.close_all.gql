###> CLOSE ALL
#{
# Closes every active browser session in the current runtime.
#}
mutation CloseAll {
  demo: X4m(
    pipeline: "BROWSER_CLOSE_ALL"
    runtime: { input: "" }
  ) {
    result
  }
}
