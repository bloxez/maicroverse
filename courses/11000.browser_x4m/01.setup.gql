#!maicro
#---
# title: Browser X4m - Full Course Setup Orchestrator
# description: Executes all Browser X4m lessons in sequence for repeatable training.
# difficulty: beginner
# estimated_time: 8m
# tags:
#   - browser
#   - x4m
#   - setup
#   - orchestrator
# intent: Run the complete course with one command and verify each lesson executes.
#---

###> STEP 0 - PRE-CLEANUP BROWSER STATE
#{
# Ensures no leftover sessions interfere with the run.
# stepinto: scripts/courses/11000.browser_x4m/11.close_all.gql
#}
mutation Step0_PreCleanup {
  cleanup: DbExecute(path: "scripts/courses/11000.browser_x4m/11.close_all.gql") {
    success
    status
    message
    executionTime
  }
}

