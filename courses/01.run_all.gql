#!maicro
#---
# title: Course Runner - Run All Course Setups
# description: Runs each course's primary 01 setup script in sequence so the course bundle can be smoke-tested end to end.
# difficulty: intermediate
# estimated_time: 10m
# tags:
#   - courses
#   - validation
#   - smoke-test
#---

###> RUN AI TASKS
#{
# Executes the AI Tasks course setup script.
#}
mutation RunAiTasks {
  ai_tasks: DbExecute(path: "scripts/courses/01000.ai_tasks/01a.ai_task_setup.gql") {
    success
    status
    message
    executionTime
    error
  }
}

